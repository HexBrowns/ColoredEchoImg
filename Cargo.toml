[package]
name = "colored-echo-img"
version = "1.3.1"
authors = ["HexBrowns"]
license = "MIT"
edition = "2021"
publish = false
description = "colored_echo_img.mod2 - frame-history colored echo for AviUtl2"

[lib]
name = "colored_echo_img"
crate-type = ["cdylib", "rlib"]  # rlib は tests/ の偽の本体のテストから呼ぶため

[dependencies]
aviutl2 = { version = "0.47", features = ["module"] }
anyhow = "1"
